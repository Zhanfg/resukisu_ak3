name: Build Linear Chinese LSPosed

on:
  push:
    branches: [linear-zh-lsposed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Reconstruct v0.3 source
        run: |
          cat v0.3/source.b64.* > /tmp/linearzh.b64
          base64 -d /tmp/linearzh.b64 > /tmp/LinearZhLSPosed-source-v0.3.0.zip
          mkdir src
          unzip -q /tmp/LinearZhLSPosed-source-v0.3.0.zip -d src
          find src -name '*.class' -delete
      - name: Build APK
        working-directory: src
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LinearZh-LSPosed-0.3.0
          path: src/app/build/outputs/apk/debug/app-debug.apk
