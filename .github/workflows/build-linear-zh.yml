name: Build Linear Chinese LSPosed

on:
  push:
    branches: [linear-zh-lsposed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Extract v0.1 base source
        run: mkdir src && unzip -q LinearZhLSPosed-source.zip -d src
      - name: Apply v0.2 Compose baseline
        run: |
          cp patch-v0.2/ModuleMain.java src/app/src/main/java/io/github/zhanfg/linearzh/ModuleMain.java
          cp patch-v0.2/Translator.java src/app/src/main/java/io/github/zhanfg/linearzh/Translator.java
          cat patch-v0.2/translations-extra.tsv >> src/app/src/main/resources/translations.tsv
          sed -i 's/versionCode = 1/versionCode = 2/' src/app/build.gradle.kts
          sed -i 's/versionName = "0.1.0"/versionName = "0.2.0-linear-1.99"/' src/app/build.gradle.kts
      - name: Apply v0.3 localization fixes
        run: |
          patch -d src -p1 < patch-v0.3/module.patch
          patch -d src -p1 < patch-v0.3/translator.patch
          patch -d src -p1 < patch-v0.3/build.patch
          cat patch-v0.3/translations-extra.* >> src/app/src/main/resources/translations.tsv
          sed -i '1c# Linear 1.99.0 Simplified Chinese exact UI mappings' src/app/src/main/resources/translations.tsv
      - name: Build APK
        working-directory: src
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LinearZh-LSPosed-0.3.0
          path: src/app/build/outputs/apk/debug/app-debug.apk
